name: Deploy to vm2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
